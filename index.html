<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubEarn Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        h1 { margin-top: 0; font-size: 24px; }
        .balance { font-size: 28px; font-weight: bold; color: #38bdf8; margin: 15px 0; }
        button {
            background-color: var(--tg-theme-button-color, #3b82f6);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>SubEarn 🚀</h1>
        <p>Ваш баланс:</p>
        <div class="balance"><span id="balance">0.00</span> ₴</div>
        
        <button onclick="topUp(100)">Поповнити 100 ₴ (CryptoBot)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Отримуємо реальний Telegram ID користувача
        const user = tg.initDataUnsafe?.user;
        const telegramId = user ? user.id : 'test_user_123';

        // Посилання на ваш бекенд на Render
        const BACKEND_URL = 'https://subearn-backend.onrender.com';

        async function fetchBalance() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/user/${telegramId}`);
                const data = await res.json();
                if (data.success) {
                    document.getElementById('balance').innerText = data.balance.toFixed(2);
                }
            } catch (e) {
                console.error('Помилка завантаження балансу', e);
            }
        }

        async function topUp(amountUAH) {
            try {
                const res = await fetch(`${BACKEND_URL}/api/create-invoice`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramId, amountUAH, asset: 'USDT' })
                });
                const data = await res.json();

                if (data.success) {
                    // Відкриваємо інвойс у Telegram через офіційне API
                    tg.openInvoice(data.bot_invoice_url, async (status) => {
                        if (status === 'paid') {
                            alert('Оплата успішна!');
                            fetchBalance();
                        }
                    });
                } else {
                    alert('Помилка: ' + data.error);
                }
            } catch (e) {
                alert('Помилка зʼєднання з сервером');
            }
        }

        fetchBalance();
        // Оновлюємо баланс кожні 5 секунд
        setInterval(fetchBalance, 5000);
    </script>
</body>
</html>
