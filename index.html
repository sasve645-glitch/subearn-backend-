<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubEarn 🚀</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 16px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #38bdf8;
        }
        .role-switch {
            display: flex;
            background: #1e293b;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
        }
        .role-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px;
            color: #94a3b8;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }
        .role-btn.active {
            background: #0284c7;
            color: white;
        }
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .balance-title {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .balance-amount {
            font-size: 28px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 12px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .btn-green {
            background-color: #22c55e;
        }
        .btn-secondary {
            background-color: #334155;
        }
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
        }
        .tab {
            flex: 1;
            background: #1e293b;
            border: none;
            border-radius: 8px;
            padding: 8px;
            color: #94a3b8;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }
        .tab.active {
            background: #0284c7;
            color: white;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        .item-list {
            background: #1e293b;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-info h4 {
            font-size: 14px;
            margin-bottom: 2px;
        }
        .item-info p {
            font-size: 12px;
            color: #38bdf8;
        }
        input, select {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            color: white;
            margin-bottom: 10px;
            font-size: 14px;
        }
        label {
            font-size: 12px;
            color: #94a3b8;
            display: block;
            margin-bottom: 4px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>SubEarn 🚀</h1>
    </div>

    <!-- Перемикач Режимів -->
    <div class="role-switch">
        <button class="role-btn active" id="btn-executor" onclick="switchRole('executor')">Виконавець</button>
        <button class="role-btn" id="btn-customer" onclick="switchRole('customer')">Замовник</button>
    </div>

    <!-- Навігація -->
    <div class="tabs">
        <button class="tab active" onclick="switchTab('main')" id="tab-main">Головна</button>
        <button class="tab" onclick="switchTab('tasks')" id="tab-tasks">Завдання</button>
        <button class="tab" onclick="switchTab('profile')" id="tab-profile">Профіль</button>
    </div>

    <!-- РЕЖИМ ВИКОНАВЦЯ -->
    <div id="mode-executor" class="role-section">
        <div id="sec-main" class="section active">
            <div class="card">
                <div class="balance-title">Баланс виконавця</div>
                <div class="balance-amount" id="executor-balance">0.00 ₴</div>
                
                <!-- Поле для введення суми поповнення -->
                <div style="margin-bottom: 12px;">
